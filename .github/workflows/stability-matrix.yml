name: Stability matrix (no emulator)

on:
  pull_request:
    paths:
      - "composeApp/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "repositories.gradle.kts"
      - "buildScript/**"
      - "library/**"
      - "libcore/**"
      - "husi.properties"
      - "run"
      - "Makefile"
      - ".github/CRONET_GO_VERSION"
      - ".github/workflows/stability-matrix.yml"
  push:
    branches: [main]
    paths:
      - "composeApp/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "repositories.gradle.kts"
      - "buildScript/**"
      - "library/**"
      - "libcore/**"
      - "husi.properties"
      - "run"
      - "Makefile"
      - ".github/CRONET_GO_VERSION"
      - ".github/workflows/stability-matrix.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: stability-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  libcore-desktop-linux-amd64:
    name: libcore desktop linux/amd64 (once)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Go version
        id: goversion
        run: |
          source buildScript/init/version.sh
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.goversion.outputs.go_version }}
          cache-dependency-path: libcore/go.sum

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Resolve cronet-go version
        id: cronet-go-version
        run: |
          echo "version=$(tr -d '[:space:]' < .github/CRONET_GO_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout cronet-go
        uses: actions/checkout@v6
        with:
          repository: sagernet/cronet-go
          ref: ${{ steps.cronet-go-version.outputs.version }}
          path: cronet-go
          submodules: recursive
          fetch-depth: 1

      - name: Cache Chromium toolchain
        uses: actions/cache@v5
        with:
          path: |
            cronet-go/naiveproxy/src/third_party/llvm-build/
            cronet-go/naiveproxy/src/gn/out/
            cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            cronet-go/naiveproxy/src/out/sysroot-build/
          key: cronet-toolchain-linux-amd64-${{ steps.cronet-go-version.outputs.version }}

      - name: Download Chromium toolchain
        run: |
          set -xeuo pipefail
          rm -f "$GITHUB_WORKSPACE/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg"
          cd "$GITHUB_WORKSPACE/cronet-go"
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target=linux/amd64 download-toolchain

      - name: Build libcore (desktop linux/amd64)
        env:
          CRONET_GO_ROOT: ${{ github.workspace }}/cronet-go
        run: |
          ./run lib core --desktop --desktoptargets linux/amd64

      - name: Verify libcore jar
        run: |
          test -f composeApp/libs/libcore-desktop-linux-amd64.jar

      - uses: actions/upload-artifact@v7
        with:
          name: libcore-desktop-linux-amd64
          path: composeApp/libs/libcore-desktop-linux-amd64.jar
          if-no-files-found: error

  stability-tests:
    name: ${{ matrix.scenario.name }}
    needs: libcore-desktop-linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - id: network-switch
            name: "stability · network switch matrix"
            test_class: "fr.husi.database.NetworkSwitchMatrixTest"
          - id: pool-degradation
            name: "stability · pool degradation matrix"
            test_class: "fr.husi.database.PoolDegradationMatrixTest"
          - id: recovery
            name: "stability · recovery matrix"
            test_class: "fr.husi.database.RecoveryMatrixTest"
          - id: in-scan-flap
            name: "stability · in-scan flap matrix"
            test_class: "fr.husi.database.InScanNetworkFlapMatrixTest"
          - id: auto-subscription
            name: "stability · auto subscription synthetic"
            test_class: "fr.husi.bg.SubscriptionAutoUpdateSyntheticTest"
          - id: auto-route-assets
            name: "stability · auto route assets synthetic"
            test_class: "fr.husi.bg.RouteAssetAutoUpdateSyntheticTest"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: libcore-desktop-linux-amd64
          path: composeApp/libs

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6

      - name: Geo / Gradle init assets
        run: ./run init action gradle

      - name: Packaging tools (headless desktop tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Write local.properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "sdk.dir=${SDK}" > local.properties

      - name: Run stability scenario
        env:
          BUILD_PLUGIN: none
          GRADLE_OPTS: -Xmx3584m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2048m
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./gradlew :composeApp:exportLibraryDefinitions :composeApp:desktopTest \
            --tests "${{ matrix.scenario.test_class }}" --no-daemon

      - name: Publish JUnit report in Checks
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "composeApp/build/test-results/desktopTest/**/*.xml"
          check_name: "Stability · ${{ matrix.scenario.id }}"
          detailed_summary: true
          include_passed: false
          fail_on_failure: false
          annotate_only: true

      - name: Upload scenario artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stability-results-${{ matrix.scenario.id }}
          path: |
            composeApp/build/test-results/desktopTest/**
            composeApp/build/reports/tests/desktopTest/**
          if-no-files-found: warn
          retention-days: 14

  stability-summary:
    name: Aggregate stability summary
    needs: stability-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download scenario artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: stability-results-*
          path: artifacts

      - name: Build stability summary json + markdown
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          artifact_dirs = sorted(Path("artifacts").glob("stability-results-*"))
          summary = {
              "run_id": os.getenv("GITHUB_RUN_ID"),
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "workflow": os.getenv("GITHUB_WORKFLOW"),
              "ref": os.getenv("GITHUB_REF"),
              "head_sha": os.getenv("GITHUB_SHA"),
              "scenarios": [],
          }

          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0

          for artifact_dir in artifact_dirs:
              scenario_id = artifact_dir.name.replace("stability-results-", "")
              xml_files = sorted(glob.glob(str(artifact_dir / "**" / "*.xml"), recursive=True))
              tests = failures = errors = skipped = 0

              for xml_path in xml_files:
                  try:
                      root = ET.parse(xml_path).getroot()
                  except ET.ParseError:
                      continue

                  if root.tag == "testsuite":
                      suites = [root]
                  else:
                      suites = [item for item in root.iter("testsuite")]

                  for suite in suites:
                      tests += int(suite.attrib.get("tests", 0))
                      failures += int(suite.attrib.get("failures", 0))
                      errors += int(suite.attrib.get("errors", 0))
                      skipped += int(suite.attrib.get("skipped", 0))

              scenario_entry = {
                  "scenario": scenario_id,
                  "tests": tests,
                  "failures": failures,
                  "errors": errors,
                  "skipped": skipped,
                  "xml_files": len(xml_files),
                  "status": "failed" if (failures + errors) > 0 else "passed",
                  "artifact": artifact_dir.name,
              }
              summary["scenarios"].append(scenario_entry)
              total_tests += tests
              total_failures += failures
              total_errors += errors
              total_skipped += skipped

          summary["totals"] = {
              "tests": total_tests,
              "failures": total_failures,
              "errors": total_errors,
              "skipped": total_skipped,
              "status": "failed" if (total_failures + total_errors) > 0 else "passed",
          }

          Path("stability-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")

          lines = []
          lines.append("# Stability Matrix Summary")
          lines.append("")
          lines.append(f"- run_id: `{summary['run_id']}`")
          lines.append(f"- workflow: `{summary['workflow']}`")
          lines.append(f"- ref: `{summary['ref']}`")
          lines.append("")
          lines.append("## Totals")
          lines.append("")
          lines.append(f"- status: `{summary['totals']['status']}`")
          lines.append(f"- tests: `{summary['totals']['tests']}`")
          lines.append(f"- failures: `{summary['totals']['failures']}`")
          lines.append(f"- errors: `{summary['totals']['errors']}`")
          lines.append(f"- skipped: `{summary['totals']['skipped']}`")
          lines.append("")
          lines.append("## Per scenario")
          lines.append("")
          for item in summary["scenarios"]:
              lines.append(
                  f"- {item['scenario']}: status=`{item['status']}`, tests={item['tests']}, "
                  f"failures={item['failures']}, errors={item['errors']}, skipped={item['skipped']}, "
                  f"xml_files={item['xml_files']}, artifact=`{item['artifact']}`"
              )

          Path("stability-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Publish summary to workflow UI
        shell: bash
        run: |
          cat stability-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: stability-summary
          path: |
            stability-summary.json
            stability-summary.md
          if-no-files-found: error
          retention-days: 14
