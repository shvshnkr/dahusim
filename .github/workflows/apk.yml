name: Build APK

on:
  push:
    branches:
      - "feature/**"
      - "dev*"
      - "main"
      - "master"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libcore:
    name: Build libcore.aar (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Golang version
        id: goversion
        run: |
          source buildScript/init/version.sh
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.go_version }}
          cache-dependency-path: libcore/go.sum

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: false

      - name: Libcore cache key
        id: corekey
        run: |
          find buildScript libcore/*.sh | xargs cat | sha1sum | awk '{print "scripts="$1}' >> "$GITHUB_OUTPUT"
          git ls-files libcore | xargs cat | sha1sum | awk '{print "libcore="$1}' >> "$GITHUB_OUTPUT"

      - name: Cache libcore.aar
        id: cache
        uses: actions/cache@v4
        with:
          path: composeApp/libs/libcore.aar
          key: libcore-android-${{ steps.corekey.outputs.scripts }}-${{ steps.corekey.outputs.libcore }}

      - name: Build libcore.aar
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core --android

      - uses: actions/upload-artifact@v4
        with:
          name: libcore-android
          path: composeApp/libs/libcore.aar
          if-no-files-found: error

  apk:
    name: Build FOSS debug APK
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: libcore-android
          path: composeApp/libs

      - name: Verify libcore
        run: |
          ls -la composeApp/libs
          test -f composeApp/libs/libcore.aar

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download geo assets
        run: ./run init action gradle

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Assemble foss debug APK
        env:
          BUILD_PLUGIN: none
        run: |
          ./gradlew :composeApp:exportLibraryDefinitions
          ./gradlew clean :androidApp:assembleFossDebug

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk -name '*.apk' -print -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: husi-foss-debug-apk
          path: dist/*.apk
          if-no-files-found: error
