name: Linux desktop (linux/amd64, test channel)

# GITHUB_TOKEN must be able to create releases (repo Settings → Actions → Workflow permissions;
# org may cap token read-only — then add secret GH_RELEASE_TOKEN with repo scope).
permissions:
  contents: write

# Manual: Actions tab. Auto: all-platforms-build.yml on push (app paths only).
on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: desktop-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-desktop-packages:
    name: Package linux/amd64 + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm libarchive-tools zstd

      - name: Go version
        id: goversion
        run: |
          source buildScript/init/version.sh
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.goversion.outputs.go_version }}
          cache-dependency-path: libcore/go.sum

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Resolve cronet-go version
        id: cronet-go-version
        run: |
          echo "version=$(tr -d '[:space:]' < .github/CRONET_GO_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout cronet-go
        uses: actions/checkout@v6
        with:
          repository: sagernet/cronet-go
          ref: ${{ steps.cronet-go-version.outputs.version }}
          path: cronet-go
          submodules: recursive
          fetch-depth: 1

      - name: Cache cronet toolchain
        uses: ./.github/actions/cronet-toolchain-linux
        with:
          cronet-version: ${{ steps.cronet-go-version.outputs.version }}

      - name: Build libcore (desktop linux/amd64)
        env:
          CRONET_GO_ROOT: ${{ github.workspace }}/cronet-go
        run: |
          ./run lib core --desktop --desktoptargets linux/amd64

      - name: Verify libcore jar
        run: |
          test -f composeApp/libs/libcore-desktop-linux-amd64.jar

      - uses: ./.github/actions/setup-dahusim-gradle

      - name: Geo / Gradle init assets
        run: ./run init action gradle

      - name: Ensure version tag for packaging
        run: |
          set -euo pipefail
          VER=$(grep '^VERSION_NAME=' husi.properties | cut -d= -f2-)
          if git rev-parse -q --verify "refs/tags/v${VER}" >/dev/null; then
            echo "Tag v${VER} already present."
          else
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            git tag -a "v${VER}" -m "ci: packaging tag for v${VER}" "${GITHUB_SHA}"
          fi

      - name: Uber jar + launcher + Linux packages
        env:
          BUILD_PLUGIN: none
        run: |
          set -euo pipefail
          make desktop_package_linux DESKTOP_TARGET=linux/amd64 LINUX_PACKAGE_FORMATS=deb,rpm,pacman

      - name: Smoke (artifacts + metadata)
        run: bash buildScript/ci/smoke_linux_desktop_packages.sh

      - name: Stage release assets
        id: assets
        run: |
          set -euo pipefail
          VER=$(grep '^VERSION_NAME=' husi.properties | cut -d= -f2-)
          VER_CODE=$(grep '^VERSION_CODE=' husi.properties | cut -d= -f2-)
          PKG=$(grep '^PACKAGE_NAME=' husi.properties | cut -d= -f2-)
          SHORT=$(git rev-parse --short HEAD)
          echo "version_name=$VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          mkdir -p release_assets
          shopt -s nullglob
          for f in composeApp/build/compose/packages/linux/*.{deb,rpm,pkg.tar.zst}; do
            base=$(basename "$f")
            ext="${base##*.}"
            case "$base" in
              *.pkg.tar.zst) ext="pkg.tar.zst" ;;
            esac
            cp -v "$f" "release_assets/${PKG}_${VER}_linux_amd64_${SHORT}.${ext}"
          done
          for f in composeApp/build/compose/jars/${PKG}-linux-x64-*.jar; do
            [ -f "$f" ] || continue
            cp -v "$f" "release_assets/${PKG}_${VER}_linux_amd64_${SHORT}.jar"
          done
          ls -la release_assets
          test "$(find release_assets -type f | wc -l)" -ge 4

      - name: Release body
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          VER="${{ steps.assets.outputs.version_name }}"
          VER_CODE="${{ steps.assets.outputs.version_code }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          chmod +x buildScript/ci/render_release_body.sh buildScript/ci/changelog_lib.sh
          export HEAD_SHA="$GITHUB_SHA" RUN_ID="${{ github.run_id }}"
          export GH_TOKEN="${{ secrets.GH_RELEASE_TOKEN || github.token }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          ./buildScript/ci/render_release_body.sh linux "$VER" "$VER_CODE" "$SHORT_SHA" "${{ github.run_id }}" "${{ github.run_number }}" "$REPO_URL"

      - uses: softprops/action-gh-release@v3
        id: gh_release
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          tag_name: linux-desktop-linux-amd64-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: Linux desktop · ${{ steps.assets.outputs.version_name }} (${{ steps.assets.outputs.version_code }}) · linux/amd64 · CI #${{ github.run_number }}
          body_path: release_body.md
          files: |
            release_assets/*

      - name: Release link (workflow summary)
        run: |
          {
            echo "## Пре-релиз опубликован · linux/amd64"
            echo
            echo "Скачивание: откройте ссылку ниже → прокрутите до **Assets**."
            echo
            echo "${{ steps.gh_release.outputs.url }}"
            echo
            echo "Фильтр по тегам: ${{ github.server_url }}/${{ github.repository }}/releases?q=linux-desktop-linux-amd64+prerelease%3Atrue"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old linux-desktop-linux-amd64 releases
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          keep=15
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | .tag_name | select(test("^linux-desktop-linux-amd64-[0-9]+$"))' |
            sed -n 's/^linux-desktop-linux-amd64-//p' | sort -rn | tail -n +"$((keep + 1))" |
            while read -r rid; do
              echo ">> delete release linux-desktop-linux-amd64-${rid}"
              gh release delete "linux-desktop-linux-amd64-${rid}" --yes || true
            done
