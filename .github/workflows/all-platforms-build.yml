name: All platforms (auto pre-release)

# After pushes that touch shippable app/runtime code: Android APK + Linux + Windows pre-releases.
# CI/workflows/tests/changelog/VERSION_CODE-only commits do not auto-build (use workflow_dispatch or gh-workflow.sh build).
on:
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "library/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "repositories.gradle.kts"
      - "buildScript/lib/**"
      - "buildScript/init/**"
      - "libcore/**"
      - "launcher/**"
      - "release/linux/**"
      - "release/windows/**"
      - "release/desktop/**"
      - "plugin/**"
      - "run"
      - "Makefile"
      - ".github/CRONET_GO_VERSION"
  workflow_dispatch:
    inputs:
      android:
        description: Build Android pre-release
        type: boolean
        default: true
      linux_desktop:
        description: Build Linux desktop pre-release
        type: boolean
        default: true
      windows_desktop:
        description: Build Windows desktop pre-release
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: all-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  changes:
    name: Detect changed platform scopes
    runs-on: ubuntu-latest
    outputs:
      run_android: ${{ steps.resolve.outputs.run_android }}
      run_linux: ${{ steps.resolve.outputs.run_linux }}
      run_windows: ${{ steps.resolve.outputs.run_windows }}
      trigger: ${{ steps.resolve.outputs.trigger }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Path filters
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shippable:
              - "androidApp/**"
              - "!androidApp/**/androidTest/**"
              - "composeApp/**"
              - "!composeApp/**/androidTest/**"
              - "!composeApp/**/commonTest/**"
              - "!composeApp/**/desktopTest/**"
              - "!composeApp/**/jvmTest/**"
              - "library/**"
              - "!library/**/androidTest/**"
              - "!library/**/commonTest/**"
              - "!library/**/desktopTest/**"
              - "!library/**/jvmTest/**"
              - "libcore/**"
              - "buildSrc/**"
              - "buildScript/lib/**"
              - "buildScript/init/**"
              - "gradle/**"
              - "gradle.properties"
              - "settings.gradle.kts"
              - "build.gradle.kts"
              - "repositories.gradle.kts"
              - "plugin/**"
              - "launcher/**"
              - "release/**"
              - "run"
              - "Makefile"
              - ".github/CRONET_GO_VERSION"
            shared:
              - "composeApp/src/commonMain/**"
              - "library/**"
              - "!library/**/androidTest/**"
              - "!library/**/commonTest/**"
              - "!library/**/desktopTest/**"
              - "!library/**/jvmTest/**"
              - "libcore/**"
              - "buildSrc/**"
              - "buildScript/lib/**"
              - "buildScript/init/**"
              - "gradle/**"
              - "gradle.properties"
              - "settings.gradle.kts"
              - "build.gradle.kts"
              - "repositories.gradle.kts"
              - "composeApp/build.gradle.kts"
              - "plugin/**"
              - "run"
              - "Makefile"
              - ".github/CRONET_GO_VERSION"
            android:
              - "androidApp/**"
              - "!androidApp/**/androidTest/**"
              - "composeApp/src/androidMain/**"
            desktop:
              - "composeApp/src/desktopMain/**"
              - "launcher/**"
              - "release/desktop/**"
            linux:
              - "release/linux/**"
            windows:
              - "release/windows/**"

      - name: Resolve platform selection
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "trigger=manual" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            echo "run_android=${{ inputs.android }}" >> "$GITHUB_OUTPUT"
            echo "run_linux=${{ inputs.linux_desktop }}" >> "$GITHUB_OUTPUT"
            echo "run_windows=${{ inputs.windows_desktop }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "trigger=push" >> "$GITHUB_OUTPUT"

          shippable="${{ steps.filter.outputs.shippable }}"
          if [ "$shippable" != "true" ]; then
            echo "skip_reason=no-shippable-app-changes" >> "$GITHUB_OUTPUT"
            echo "run_android=false" >> "$GITHUB_OUTPUT"
            echo "run_linux=false" >> "$GITHUB_OUTPUT"
            echo "run_windows=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip_reason=" >> "$GITHUB_OUTPUT"

          shared="${{ steps.filter.outputs.shared }}"
          android="${{ steps.filter.outputs.android }}"
          desktop="${{ steps.filter.outputs.desktop }}"
          linux="${{ steps.filter.outputs.linux }}"
          windows="${{ steps.filter.outputs.windows }}"

          run_android=false
          run_linux=false
          run_windows=false

          if [ "$shared" = "true" ] || [ "$android" = "true" ]; then
            run_android=true
          fi
          if [ "$shared" = "true" ] || [ "$desktop" = "true" ] || [ "$linux" = "true" ]; then
            run_linux=true
          fi
          if [ "$shared" = "true" ] || [ "$desktop" = "true" ] || [ "$windows" = "true" ]; then
            run_windows=true
          fi

          echo "run_android=$run_android" >> "$GITHUB_OUTPUT"
          echo "run_linux=$run_linux" >> "$GITHUB_OUTPUT"
          echo "run_windows=$run_windows" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: changes
    if: ${{ needs.changes.outputs.run_android == 'true' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit

  linux-desktop:
    name: Linux desktop
    needs: changes
    if: ${{ needs.changes.outputs.run_linux == 'true' }}
    uses: ./.github/workflows/desktop-linux-test.yml
    secrets: inherit

  windows-desktop:
    name: Windows desktop
    needs: changes
    if: ${{ needs.changes.outputs.run_windows == 'true' }}
    uses: ./.github/workflows/desktop-windows-test.yml
    secrets: inherit

  summary:
    name: Build selection summary
    runs-on: ubuntu-latest
    needs: [changes, android, linux-desktop, windows-desktop]
    if: ${{ always() }}
    steps:
      - name: Publish selection and release metadata
        shell: bash
        run: |
          {
            echo "## All-platforms selection"
            echo
            echo "- trigger: \`${{ needs.changes.outputs.trigger }}\`"
            if [ -n "${{ needs.changes.outputs.skip_reason }}" ]; then
              echo "- skip_reason: \`${{ needs.changes.outputs.skip_reason }}\` (no pre-releases; use **Run workflow** or \`gh-workflow.sh build\` after tests)"
            fi
            echo "- run_id: \`${{ github.run_id }}\`"
            echo "- run_android: \`${{ needs.changes.outputs.run_android }}\`"
            echo "- run_linux: \`${{ needs.changes.outputs.run_linux }}\`"
            echo "- run_windows: \`${{ needs.changes.outputs.run_windows }}\`"
            echo
            echo "## Job results"
            echo
            echo "- android: \`${{ needs.android.result }}\`"
            echo "- linux-desktop: \`${{ needs.linux-desktop.result }}\`"
            echo "- windows-desktop: \`${{ needs.windows-desktop.result }}\`"
            echo
            echo "## Expected release tags for this run"
            echo
            echo "- android tag: \`android-${{ github.run_id }}\`"
            echo "- linux tag: \`linux-desktop-linux-amd64-${{ github.run_id }}\`"
            echo "- windows tag: \`windows-desktop-windows-amd64-${{ github.run_id }}\`"
            echo
            if [ "${{ needs.changes.outputs.trigger }}" = "manual" ]; then
              echo "Manual run: Actions → **Run workflow** on this file."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
