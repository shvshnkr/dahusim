name: Build

on:
  push:
    branches:
      - "feature/**"
      - "dev*"
      - "main"
      - "master"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libcore:
    name: Libcore (Android AAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Go version
        id: goversion
        run: |
          source buildScript/init/version.sh
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.go_version }}
          cache-dependency-path: libcore/go.sum

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: false

      - name: Libcore cache key
        id: corekey
        run: |
          find buildScript libcore -maxdepth 1 -name '*.sh' -print0 | sort -z | xargs -0 cat | sha1sum | awk '{print "scripts="$1}' >> "$GITHUB_OUTPUT"
          git ls-files libcore | xargs cat | sha1sum | awk '{print "libcore="$1}' >> "$GITHUB_OUTPUT"

      - name: Cache libcore.aar
        id: cache
        uses: actions/cache@v4
        with:
          path: composeApp/libs/libcore.aar
          key: libcore-android-${{ steps.corekey.outputs.scripts }}-${{ steps.corekey.outputs.libcore }}

      - name: Build libcore.aar
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core --android

      - uses: actions/upload-artifact@v4
        with:
          name: libcore-android
          path: composeApp/libs/libcore.aar
          if-no-files-found: error

  android-play-arm64:
    name: Play debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: libcore-android
          path: composeApp/libs

      - name: Verify libcore
        run: |
          ls -la composeApp/libs
          test -f composeApp/libs/libcore.aar

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Geo / Gradle init assets
        run: ./run init action gradle

      - name: Write local.properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "sdk.dir=${SDK}" > local.properties

      - name: Assemble Play debug (arm64-v8a)
        env:
          BUILD_PLUGIN: none
        run: |
          ./gradlew :composeApp:exportLibraryDefinitions
          ./gradlew assemblePlayDebugArm64 --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk -name '*.apk' -print -exec cp -v {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dahusim-play-arm64-debug-apk
          path: dist/*.apk
          if-no-files-found: error
