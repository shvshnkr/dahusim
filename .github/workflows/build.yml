name: Android (Play debug, all ABI, pre-release)

# Manual: Actions tab. Auto: all-platforms-build.yml on push (app paths only).
on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Do not cancel in-progress: Android assemblePlayDebugAllAbi is long; a follow-up push
# would otherwise kill Gradle mid-task ("Error: The operation was canceled").
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  libcore:
    name: Libcore (Android AAR)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Go version
        id: goversion
        run: |
          source buildScript/init/version.sh
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.goversion.outputs.go_version }}
          cache-dependency-path: libcore/go.sum

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: false

      - name: Libcore cache key
        id: corekey
        run: |
          find buildScript libcore -maxdepth 1 -name '*.sh' -print0 | sort -z | xargs -0 cat | sha1sum | awk '{print "scripts="$1}' >> "$GITHUB_OUTPUT"
          git ls-files libcore | xargs cat | sha1sum | awk '{print "libcore="$1}' >> "$GITHUB_OUTPUT"

      - name: Cache libcore.aar
        id: cache
        uses: actions/cache@v5
        with:
          path: composeApp/libs/libcore.aar
          key: libcore-android-${{ steps.corekey.outputs.scripts }}-${{ steps.corekey.outputs.libcore }}

      - name: Build libcore.aar
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core --android

      - uses: actions/upload-artifact@v7
        with:
          name: libcore-android
          path: composeApp/libs/libcore.aar
          if-no-files-found: error

  android-play-all-abi:
    name: Play debug APK (все ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: libcore
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          name: libcore-android
          path: composeApp/libs

      - name: Verify libcore
        run: |
          ls -la composeApp/libs
          test -f composeApp/libs/libcore.aar

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6

      - name: Geo / Gradle init assets
        run: ./run init action gradle

      - name: Write local.properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "sdk.dir=${SDK}" > local.properties

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_PASS:-}" ] && [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            test -s release.keystore
          fi

      - name: Assemble Play APK (release if keystore, else debug)
        env:
          BUILD_PLUGIN: none
          ORG_GRADLE_PROJECT_skipDesktopLibPreCheck: "true"
          GRADLE_OPTS: -Xmx3584m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2048m
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_PASS:-}" ] && [ -f release.keystore ]; then
            echo "build_type=release" >> "$GITHUB_ENV"
            ./gradlew :composeApp:exportLibraryDefinitions assemblePlayReleaseAllAbi --no-daemon
          else
            echo "build_type=debug" >> "$GITHUB_ENV"
            ./gradlew :composeApp:exportLibraryDefinitions assemblePlayDebugAllAbi --no-daemon
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk -name '*.apk' -print -exec cp -v {} dist/ \;
          ls -la dist
          # Ожидаем 4 split-APK (arm64-v8a, armeabi-v7a, x86_64, x86)
          test "$(find dist -name '*.apk' | wc -l)" -eq 4

      - uses: actions/upload-artifact@v7
        with:
          name: dahusim-play-debug-all-abi-apks
          path: dist
          if-no-files-found: error

  android-release:
    name: GitHub pre-release (Android APK)
    needs: [android-play-all-abi]
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dahusim-play-debug-all-abi-apks
          path: dist

      - name: Version, rename APK by ABI, release notes
        id: rel
        env:
          BUILD_TYPE: ${{ env.build_type }}
        run: |
          set -e
          VER=$(grep '^VERSION_NAME=' husi.properties | cut -d= -f2-)
          SAFE_VER=$(printf '%s' "$VER" | tr ' /+' '---' | sed 's/[^0-9A-Za-z._-]/_/g')
          echo "version_name=$VER" >> "$GITHUB_OUTPUT"
          echo "safe_version=$SAFE_VER" >> "$GITHUB_OUTPUT"
          mkdir -p release_assets
          count=0
          for apk in dist/*.apk; do
            [ -f "$apk" ] || continue
            bn=$(basename "$apk")
            abi=$(echo "$bn" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86' | head -1)
            if [ -z "$abi" ]; then
              abi="unknown"
            fi
            abi_safe=$(echo "$abi" | tr '-' '_')
            build_type="${BUILD_TYPE:-debug}"
            dest="release_assets/dahusim_${SAFE_VER}_play_${build_type}_${abi_safe}.apk"
            cp -v "$apk" "$dest"
            count=$((count + 1))
          done
          [ "$count" -ge 1 ]
          {
            echo "## Pre-release: dahusim $VER"
            echo
            echo "**Как скачать:** внизу страницы блок **Assets** — по одному APK на архитектуру (**arm64-v8a**, **armeabi-v7a**, **x86_64**, **x86**). Имена вида \`dahusim_<версия>_play_debug_<abi>.apk\`."
            echo
            echo "**Этот pre-release — только Android APK.** Сборки **Linux / Windows desktop** (zip, deb, …) публикуются **другими** workflows; для desktop на ПК нужен **Java 21+**, см. README."
            echo
            echo "В этой ветке в описаниях **«КВН»** используется **вместо** слова «VPN» (шутливая подмена, не гарантия «услуги»). Возможен **автовыбор** публичных/открытых серверов энтузиастов — риск и закон на вас, см. README."
            echo
            echo "## Коммит сборки"
            echo
            git log -1 --oneline
            echo
            echo "## Недавние коммиты"
            echo
            git log -25 --oneline --no-merges
          } > release_body.md

      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          tag_name: android-${{ github.run_id }}
          name: "dahusim ${{ steps.rel.outputs.version_name }} Android (сборка ${{ github.run_number }})"
          body_path: release_body.md
          files: release_assets/*.apk
