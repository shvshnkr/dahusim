name: JDK matrix (composeApp desktop tests)

# Manual run always. Push to main: only paths that affect composeApp desktop / libcore / Gradle.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jdk-matrix-test.yml"
      - "composeApp/**"
      - "library/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "repositories.gradle.kts"
      - "buildScript/**"
      - "libcore/**"
      - "husi.properties"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Long-running: do not cancel in-progress on new pushes (same idea as build.yml).
concurrency:
  group: jdk-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  libcore-desktop-linux-amd64:
    name: libcore desktop linux/amd64 (once)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Go version
        id: goversion
        run: |
          source buildScript/init/version.sh
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.goversion.outputs.go_version }}
          cache-dependency-path: libcore/go.sum

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Resolve cronet-go version
        id: cronet-go-version
        run: |
          echo "version=$(tr -d '[:space:]' < .github/CRONET_GO_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout cronet-go
        uses: actions/checkout@v6
        with:
          repository: sagernet/cronet-go
          ref: ${{ steps.cronet-go-version.outputs.version }}
          path: cronet-go
          submodules: recursive
          fetch-depth: 1

      - name: Cache Chromium toolchain
        uses: actions/cache@v5
        with:
          path: |
            cronet-go/naiveproxy/src/third_party/llvm-build/
            cronet-go/naiveproxy/src/gn/out/
            cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            cronet-go/naiveproxy/src/out/sysroot-build/
          key: cronet-toolchain-linux-amd64-${{ steps.cronet-go-version.outputs.version }}

      - name: Download Chromium toolchain
        run: |
          set -xeuo pipefail
          rm -f "$GITHUB_WORKSPACE/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg"
          cd "$GITHUB_WORKSPACE/cronet-go"
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target=linux/amd64 download-toolchain

      - name: Build libcore (desktop linux/amd64)
        env:
          CRONET_GO_ROOT: ${{ github.workspace }}/cronet-go
        run: |
          ./run lib core --desktop --desktoptargets linux/amd64

      - name: Verify libcore jar
        run: |
          test -f composeApp/libs/libcore-desktop-linux-amd64.jar

      - uses: actions/upload-artifact@v7
        with:
          name: libcore-desktop-linux-amd64
          path: composeApp/libs/libcore-desktop-linux-amd64.jar
          if-no-files-found: error

  compose-app-desktop-tests:
    name: JDK ${{ matrix.java-version }} · desktopTest
    needs: libcore-desktop-linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        java-version: [21, 22, 23, 24, 25, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: libcore-desktop-linux-amd64
          path: composeApp/libs

      - name: Verify libcore jar
        run: |
          test -f composeApp/libs/libcore-desktop-linux-amd64.jar

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6

      - name: Geo / Gradle init assets
        run: ./run init action gradle

      - name: Packaging tools (headless desktop tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Write local.properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "sdk.dir=${SDK}" > local.properties

      - name: exportLibraryDefinitions + desktopTest
        env:
          BUILD_PLUGIN: none
          GRADLE_OPTS: -Xmx3584m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2048m
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./gradlew :composeApp:exportLibraryDefinitions :composeApp:desktopTest --no-daemon
