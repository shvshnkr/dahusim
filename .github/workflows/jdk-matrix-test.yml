name: JDK matrix (composeApp desktop tests)

# Auto on PR+main (path-scoped) and manual run.
on:
  pull_request:
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "library/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "repositories.gradle.kts"
      - "buildScript/**"
      - "libcore/**"
      - "launcher/**"
      - "release/linux/**"
      - "release/windows/**"
      - "release/desktop/**"
      - "husi.properties"
      - "plugin/**"
      - "run"
      - "Makefile"
      - ".github/CRONET_GO_VERSION"
      - ".github/workflows/jdk-matrix-test.yml"
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "library/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "repositories.gradle.kts"
      - "buildScript/**"
      - "libcore/**"
      - "launcher/**"
      - "release/linux/**"
      - "release/windows/**"
      - "release/desktop/**"
      - "husi.properties"
      - "plugin/**"
      - "run"
      - "Makefile"
      - ".github/CRONET_GO_VERSION"
      - ".github/workflows/jdk-matrix-test.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Long-running: do not cancel in-progress on new pushes (same idea as build.yml).
concurrency:
  group: jdk-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  libcore-desktop-linux-amd64:
    name: libcore desktop linux/amd64 (once)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Go version
        id: goversion
        run: |
          source buildScript/init/version.sh
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.goversion.outputs.go_version }}
          cache-dependency-path: libcore/go.sum

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Resolve cronet-go version
        id: cronet-go-version
        run: |
          echo "version=$(tr -d '[:space:]' < .github/CRONET_GO_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout cronet-go
        uses: actions/checkout@v6
        with:
          repository: sagernet/cronet-go
          ref: ${{ steps.cronet-go-version.outputs.version }}
          path: cronet-go
          submodules: recursive
          fetch-depth: 1

      - name: Cache cronet toolchain
        uses: ./.github/actions/cronet-toolchain-linux
        with:
          cronet-version: ${{ steps.cronet-go-version.outputs.version }}

      - name: Build libcore (desktop linux/amd64)
        env:
          CRONET_GO_ROOT: ${{ github.workspace }}/cronet-go
        run: |
          ./run lib core --desktop --desktoptargets linux/amd64

      - name: Verify libcore jar
        run: |
          test -f composeApp/libs/libcore-desktop-linux-amd64.jar

      - uses: actions/upload-artifact@v7
        with:
          name: libcore-desktop-linux-amd64
          path: composeApp/libs/libcore-desktop-linux-amd64.jar
          if-no-files-found: error

  compose-app-desktop-tests:
    name: JDK ${{ matrix.java-version }} · desktopTest
    needs: libcore-desktop-linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        java-version: [21, 22, 23, 24, 25, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: libcore-desktop-linux-amd64
          path: composeApp/libs

      - name: Verify libcore jar
        run: |
          test -f composeApp/libs/libcore-desktop-linux-amd64.jar

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-dahusim-gradle
        with:
          cache-write: ${{ matrix.java-version == 21 }}

      - name: Geo / Gradle init assets
        run: ./run init action gradle

      - name: Packaging tools (headless desktop tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Write local.properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "sdk.dir=${SDK}" > local.properties

      - name: exportLibraryDefinitions + desktopTest
        id: desktop-tests
        env:
          BUILD_PLUGIN: none
          GRADLE_OPTS: -Xmx3584m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2048m
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./gradlew :composeApp:exportLibraryDefinitions :composeApp:desktopTest --no-daemon

      - name: Publish JUnit report in Checks
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "composeApp/build/test-results/desktopTest/**/*.xml"
          check_name: "JUnit · JDK ${{ matrix.java-version }} · desktopTest"
          detailed_summary: true
          include_passed: false
          fail_on_failure: false
          annotate_only: true

      - name: Upload desktopTest artifacts (JDK scoped)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jdk-${{ matrix.java-version }}
          path: |
            composeApp/build/test-results/desktopTest/**
            composeApp/build/reports/tests/desktopTest/**
          if-no-files-found: warn
          retention-days: 14

  ci-test-summary:
    name: Aggregate matrix test summary
    needs: compose-app-desktop-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all matrix test artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-jdk-*
          path: artifacts

      - name: Build summary json + markdown
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          artifact_dirs = sorted(Path("artifacts").glob("test-results-jdk-*"))
          summary = {
              "run_id": os.getenv("GITHUB_RUN_ID"),
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "workflow": os.getenv("GITHUB_WORKFLOW"),
              "ref": os.getenv("GITHUB_REF"),
              "head_sha": os.getenv("GITHUB_SHA"),
              "matrix": [],
          }

          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0

          for artifact_dir in artifact_dirs:
              jdk = artifact_dir.name.replace("test-results-jdk-", "")
              xml_files = sorted(glob.glob(str(artifact_dir / "**" / "*.xml"), recursive=True))
              tests = failures = errors = skipped = 0

              for xml_path in xml_files:
                  try:
                      root = ET.parse(xml_path).getroot()
                  except ET.ParseError:
                      continue

                  if root.tag == "testsuite":
                      suites = [root]
                  else:
                      suites = [item for item in root.iter("testsuite")]

                  for suite in suites:
                      tests += int(suite.attrib.get("tests", 0))
                      failures += int(suite.attrib.get("failures", 0))
                      errors += int(suite.attrib.get("errors", 0))
                      skipped += int(suite.attrib.get("skipped", 0))

              matrix_entry = {
                  "jdk": jdk,
                  "tests": tests,
                  "failures": failures,
                  "errors": errors,
                  "skipped": skipped,
                  "xml_files": len(xml_files),
                  "status": "failed" if (failures + errors) > 0 else "passed",
                  "artifact": artifact_dir.name,
              }
              summary["matrix"].append(matrix_entry)
              total_tests += tests
              total_failures += failures
              total_errors += errors
              total_skipped += skipped

          summary["totals"] = {
              "tests": total_tests,
              "failures": total_failures,
              "errors": total_errors,
              "skipped": total_skipped,
              "status": "failed" if (total_failures + total_errors) > 0 else "passed",
          }

          Path("ci-test-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")

          lines = []
          lines.append("# CI Test Summary")
          lines.append("")
          lines.append(f"- run_id: `{summary['run_id']}`")
          lines.append(f"- workflow: `{summary['workflow']}`")
          lines.append(f"- ref: `{summary['ref']}`")
          lines.append(f"- head_sha: `{summary['head_sha']}`")
          lines.append("")
          lines.append("## Totals")
          lines.append("")
          lines.append(f"- status: `{summary['totals']['status']}`")
          lines.append(f"- tests: `{summary['totals']['tests']}`")
          lines.append(f"- failures: `{summary['totals']['failures']}`")
          lines.append(f"- errors: `{summary['totals']['errors']}`")
          lines.append(f"- skipped: `{summary['totals']['skipped']}`")
          lines.append("")
          lines.append("## Per JDK")
          lines.append("")
          for item in summary["matrix"]:
              lines.append(
                  f"- JDK {item['jdk']}: status=`{item['status']}`, tests={item['tests']}, "
                  f"failures={item['failures']}, errors={item['errors']}, skipped={item['skipped']}, "
                  f"xml_files={item['xml_files']}, artifact=`{item['artifact']}`"
              )

          Path("ci-test-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Publish summary to workflow UI
        shell: bash
        run: |
          cat ci-test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-summary
          path: |
            ci-test-summary.json
            ci-test-summary.md
          if-no-files-found: error
          retention-days: 14
