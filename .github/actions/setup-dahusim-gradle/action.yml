name: Setup Dahusim Gradle
description: >
  Shared setup-gradle policy: one cache writer per workflow on main, read-only elsewhere,
  aggressive cache cleanup before save.
inputs:
  cache-write:
    description: >
      When true and ref is main, persist Gradle caches. Matrix legs should pass false on all but one job.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.cache-write != 'true' || github.ref != 'refs/heads/main' }}
        cache-cleanup: always
        gradle-home-cache-excludes: |
          caches/build-cache-1
